spring.application.name=backend
server.port=8080

# MySQL — set MYSQL_PASSWORD to your local MySQL password if it is not "root"
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/desi_pop_sauce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10

# Frontend (Vite) origins for REST
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
